<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mouse Ramp — Training Ground</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#eaf6ff;
    font-family:-apple-system, system-ui, sans-serif; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #game { position:fixed; inset:0; display:block; }
  #logBtn { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px;
    border:1px solid #c9b896; background:rgba(255,248,234,.88); color:#5a4632;
    border-radius:999px; padding:7px 14px; font-size:13px; }
  #logPanel { position:fixed; left:12px; right:12px; top:calc(60px + env(safe-area-inset-top)); bottom:calc(60px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.97); border:2px solid #c9b896; border-radius:16px;
    padding:12px; display:none; z-index:10; }
  #logText { width:100%; height:calc(100% - 44px); box-sizing:border-box;
    font-family:ui-monospace, monospace; font-size:11px; border:1px solid #ddd; border-radius:8px; }
  #logPanel button { border:1px solid #c9b896; background:#fff8ea; color:#5a4632;
    border-radius:999px; padding:7px 14px; font-size:13px; margin-right:8px; }
  #logStatus { font-size:12px; color:#7a6a55; }
  #helpBtn { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:12px;
    width:44px; height:44px; border-radius:50%;
    border:1px solid #c9b896; background:#fff8ea; color:#5a4632;
    font-size:20px; font-weight:700; padding:0; }
  #helpModal { position:fixed; inset:0; background:rgba(60,45,20,.45);
    display:none; z-index:20; overflow-y:auto; }
  #helpCard { background:#fffdf6; border:2px solid #c9b896; border-radius:16px;
    max-width:420px; margin:calc(24px + env(safe-area-inset-top)) auto 24px;
    padding:16px 16px 20px; color:#5a4632; position:relative; }
  #helpCard h2 { margin:0 0 12px; font-size:18px; text-align:center; }
  #helpClose { position:absolute; top:8px; right:8px; width:32px; height:32px;
    border-radius:50%; border:1px solid #c9b896; background:#fff8ea; color:#5a4632;
    font-size:18px; line-height:1; padding:0; }
  #helpCard figure { margin:0 0 14px; }
  #helpCard canvas { width:100%; display:block; border-radius:12px; }
  #helpCard figcaption { font-size:13px; color:#7a6a55; margin-top:6px; text-align:center; }
  #helpGotIt { display:block; margin:4px auto 0; border:1px solid #c9b896;
    background:#fff8ea; color:#5a4632; border-radius:999px; padding:9px 18px; font-size:14px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="helpBtn" type="button" aria-label="What can I do?">?</button>

<button id="logBtn" type="button">LOG</button>
<div id="logPanel"><textarea id="logText" readonly></textarea><div><button id="logCopy" type="button">Copy log</button><button id="logClose" type="button">Close</button><span id="logStatus"></span></div></div>
<div id="helpModal"><div id="helpCard">
  <button id="helpClose" type="button" aria-label="Close">×</button>
  <h2>What can I do?</h2>
  <figure><canvas id="cap1" width="360" height="240"></canvas><figcaption>Draw a ramp — when the green line locks into the node, let go and he climbs.</figcaption></figure>
  <figure><canvas id="cap2" width="360" height="240"></canvas><figcaption>Draw the next ramp while he's climbing — he finishes the first, then takes the second.</figcaption></figure>
  <figure><canvas id="cap3" width="360" height="240"></canvas><figcaption>Bridge a gap — a flat line between two nodes carries him across.</figcaption></figure>
  <button id="helpGotIt" type="button">Got it — let me play</button>
</div></div>
<script>
"use strict";
// ============================================================
// MOUSE RAMP — TRAINING GROUND (2026-10-23, Larry's spec;
// repurposed 2026-11-06: no win, no finish, just ledges to climb)
// Flappy-simple, one-input game on a STATIC screen — no scrolling
// (the scrolling version is endless.html).
//
// The mouse (Larry's footless mouse sprites) ALWAYS runs. He starts
// at the base running left and right, turning at the walls.
//  · Finger down  -> he runs TOWARD the finger.
//  · Fingertip (a small round touch) BLOCKING him -> he bumps it
//    and turns the other way.
//  · Finger laid down at an angle (a long, tilted touch patch) ->
//    it's a RAMP: if he can reach its low edge he runs onto it and
//    follows it up/down, and steps off onto any ledge its far edge
//    touches. That's how you bridge the gaps between platforms.
//  · Finger lifted -> any ramp vanishes; he falls if he was on it,
//    and keeps running in the direction he was running.
//
// Row spacing target is Larry's 1–3 inches; on one static screen
// the spacing is fitted (≈100–190px) so 4 rows fit — full spacing
// returns with the scrolling version, where rows are no longer
// screen-bound. Every row has gaps ≥ ~100px, wide enough for the
// mouse to pass through.
//
// Finger model (honest, same as the pet prototype): a phone gives
// a touch point + approximate patch size/shape (radiusX/radiusY/
// rotationAngle where exposed). An elongated or large patch =
// ramp segment, a small round patch = fingertip blocker. Desktop
// mouse: press-and-drag draws the ramp between press point and
// cursor.
//
// FIX 2026-10-23 (Larry: "diagonal finger doesn't become a ramp"):
// three stacked causes — (1) iOS can fire touchstart BEFORE
// pointerdown, and the old patch handler dropped the patch if the
// press hadn't registered yet, so a still-held finger stayed a
// round fingertip forever; the patch is now cached on touchstart
// and merged into the press whenever it lands. (2) The old ramp
// cutoff (patch radius >= 48) sat above what a real diagonal
// finger pad often reports; classification now uses elongation
// (ratio) as well as size, and the segment is extended to a
// usable finger length — the sensor only reports the contact
// core, not the whole finger. (3) The step-up tolerance (26px)
// was thinner than a finger; it's now ~a finger's thickness.
//
// FIX 2 2026-10-23 (still failing on Larry's phone): stop relying
// on the patch ellipse alone — its orientation data is unreliable
// across devices. A touch that MOVES now defines the ramp from
// its own path: when you lay a finger down, the touch point
// travels from your fingertip toward your hand as the finger
// flattens, and a deliberate short slide does the same. That
// trajectory (start point -> current point, extended to ramp
// length) becomes the ramp whenever it makes a runnable slope;
// the patch ellipse is the fallback for a perfectly still lay.
// Gesture: touch at one end of the ramp you want, slide a short
// way along it, hold.
//
// FIX 3 2026-10-23 — MEASURED on Larry's iPhone via Touch Lab:
// rotationAngle is ALWAYS 0.0° and radiusY can read 0.0; the
// PointerEvent contact size is a square (97x97). So the patch
// ellipse carries NO orientation on his device — the old code
// turned every diagonal finger into a HORIZONTAL bar. Confirmed
// too: touchstart fires before pointerdown there. And his
// natural diagonal lay travels at ~58° of slope (250px from
// (307,521) to (176,309)) — steeper than the old 55° climb
// limit, so even the correct segment was rejected as a wall.
// Changes: the touch path now ALWAYS wins over the patch when
// the touch has travelled, and the climbable limit is 70°
// (a mouse can scramble up a steep ramp; only near-vertical
// is a wall).
// ============================================================

const CFG = {
  speed: 138,          // px/s, his constant run speed
  gravity: 1900,       // px/s^2 while falling
  climb: 54,           // px he can step up/down onto a ramp edge (~finger thickness)
  transfer: 40,        // px ledge-height tolerance stepping off a ramp
  faceH: 14,           // drawn platform height — a line ending on the platform's visible face counts as connecting
  edgeSnap: 48,        // px: a ramp's far end may miss a platform's edge by this much and still count as landing on it
  snapR: 64,           // B: auto-snap radius — a drawn endpoint within this of his platform / an edge above snaps to it (ported from endless 2026-10-29)
  maxRampDeg: 88,      // Larry 2026-11-05: so long as the line isn't vertical, it should be good — only a line within 1.5deg of vertical is rejected (was 70)
  halfW: 27,           // mouse body half-width for support/collision
  bodyH: 66,           // mouse body height
  drawW: 104,          // sprite draw width (canvas art is 720x560)
};

const SPRITES = {
  idleR: 'mouse-right.png', idleL: 'mouse-left.png',
  runR: ['mouse-right-run-1.png','mouse-right-run-2.png','mouse-right-run-3.png','mouse-right-run-2.png'],
  runL: ['mouse-left-run-1.png','mouse-left-run-2.png','mouse-left-run-3.png','mouse-left-run-2.png'],
};
const IMG = {};
Object.values(SPRITES).flat().forEach(src => { const i = new Image(); i.src = src; IMG[src] = i; });

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = innerWidth, H = innerHeight;
function fitCanvas(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ---------- level ----------
let groundY = 0, platforms = [];
let clouds = []; // soft rounded clouds (endless parity, Larry 2026-11-06) — screen-space decoration, behind everything
function buildLevel(){
  groundY = H - 44;
  const spacing = Math.max(96, Math.min(288, Math.round((H - 170) / 4.4)));
  const row = i => groundY - spacing * i;
  const gap = Math.max(100, W * 0.26);
  platforms = [
    // row 1
    { x1: 0, x2: W * 0.36, y: row(1) },
    { x1: W * 0.36 + gap, x2: W, y: row(1) },
    // row 2
    { x1: W * 0.09, x2: W * 0.45, y: row(2) },
    { x1: W * 0.45 + gap, x2: W, y: row(2) },
    // row 3
    { x1: 0, x2: W * 0.40, y: row(3) },
    { x1: W * 0.40 + gap, x2: W, y: row(3) },
    // row 4 — the top row
    { x1: W * 0.26, x2: W * 0.74, y: row(4) },
  ];
  // clouds (endless parity, Larry 2026-11-06): four soft rounded
  // whites in fixed height bands across the upper sky, drifting
  // slowly left in screen space — decoration only, never part of
  // the world (no scroll/follow, no collision).
  clouds = [0.08, 0.20, 0.33, 0.45].map((fy, i) => ({
    x: Math.random() * W, y: Math.round(H * fy),
    s: [1.0, 0.8, 1.15, 0.9][i], v: 10 + (i % 3) * 3, // px/s, slow drift left
    a: [0.95, 0.85, 0.9, 0.8][i],
  }));
}
buildLevel();
fitCanvas();
addEventListener('resize', () => {
  W = innerWidth; H = innerHeight; buildLevel(); fitCanvas();
  S.y = Math.min(S.y, groundY); if (S.mode === 'run' && S.surface.type === 'ground') S.y = groundY;
});

// ---------- state ----------
const GROUND = { type: 'ground' };
const S = {
  x: 70, y: 0, dir: 1, vy: 0,
  mode: 'run',              // run | fall
  surface: GROUND,          // GROUND | platform obj | {type:'finger'}
  runT: 0,
  finger: null,             // {x,y,rx,ry,rot, dragA, ox,oy}
  steerDone: false,         // this press has done its steering (he mounted it or bumped it)
  spentFinger: null,        // the finger whose press is spent — set only when ITS (live) line is disembarked, departed, or crossed; a different finger is never spent by it (a kept line's exit spends no finger)
  verticalFall: false,      // falling straight down after a ramp crossing (x locked until landing)
  rampOrigin: null,         // surface he mounted the current ramp from (its line never blocks him)
  fallExclude: null,        // platform a vertical fall must pass to land strictly below it (the crossed one)
  fallFrom: null,           // platform he ran off (for the fall-landing gate: a finger line is only landable while falling if it touches the surface he fell from)
  rampDir: 1,               // committed ramp direction, locked at mount — nothing turns him mid-ramp
  rampFinger: null,           // finger object he mounted the current ramp with (a new press replacing his line drops him, it never snaps him)
  keptSeg: null,            // first kept line, if one was drawn
  keptSeg2: null,           // second kept line, if one was drawn while the first was still up
  rampSlot: null,           // which kept slot he is climbing (1, 2) or 'live' — so releasing mid-climb doesn't switch him to the other kept line
  deletePress: false,        // this press tapped a kept line's circled x: it deletes, it doesn't draw
};
S.y = groundY;

// ---------- play log (Larry 2026-10-27: monitoring session) ----------
// Every decision the engine makes, in one place: when a defect
// happens, tap LOG and paste this into chat — it pins the exact
// frame, segment, and decision instead of a description. Capped at
// 400 events (oldest drop off); game coordinates only, no personal
// data. The LOG button is DOM above the canvas, so tapping it
// never registers as a game press.
const LOG = [];
let LT = 0, lastGreen = null, LOG_STARTED = false;
const LOG_CAP = 400;
function platStr(p){
  if (!p) return 'none';
  if (p.type === 'ground') return 'ground';
  if (p.type === 'finger') return 'finger';
  if (p.type === 'air') return 'air';
  return '[' + p.x1 + ',' + p.x2 + ']@' + p.y + (p.row ? ' row' + p.row : '');
}
function segStr(s){
  return s ? '(' + Math.round(s.ax) + ',' + Math.round(s.ay) + ')-(' + Math.round(s.bx) + ',' + Math.round(s.by) + ')' : 'none';
}
function logEvent(kind, msg){
  LOG.push(LT.toFixed(2) + 's ' + kind + ' ' + msg);
  while (LOG.length > LOG_CAP) LOG.shift();
}
function showLog(){
  if (typeof document === 'undefined' || !document.getElementById) return;
  const panel = document.getElementById('logPanel');
  const text = document.getElementById('logText');
  const status = document.getElementById('logStatus');
  if (!panel || !text) return;
  text.value = LOG.join('\n') || '(no events yet)';
  panel.style.display = 'block';
  if (status) status.textContent = LOG.length + ' events — tap Copy log, then paste it in chat';
}
function copyLog(){
  if (typeof document === 'undefined' || !document.getElementById) return;
  const status = document.getElementById('logStatus');
  const txt = LOG.join('\n');
  const done = () => { if (status) status.textContent = 'Copied — paste it in chat'; };
  const fallback = () => {
    const text = document.getElementById('logText');
    if (text){ text.focus(); text.select(); try { document.execCommand('copy'); done(); return; } catch (e){} }
    if (status) status.textContent = 'Could not auto-copy — select all in the box and copy it';
  };
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else fallback();
}
(function wireLogUI(){
  if (typeof document === 'undefined' || !document.getElementById) return;
  const btn = document.getElementById('logBtn');
  if (btn && btn.addEventListener) btn.addEventListener('click', showLog);
  const copy = document.getElementById('logCopy');
  if (copy && copy.addEventListener) copy.addEventListener('click', copyLog);
  const close = document.getElementById('logClose');
  if (close && close.addEventListener) close.addEventListener('click', () => {
    const panel = document.getElementById('logPanel');
    if (panel) panel.style.display = 'none';
  });
})();

// ---------- capabilities modal ("?" button, Larry 2026-11-06) ----------
// Opt-in, never forced: the training ground teaches nothing on its
// own, but "?" opens three pictures of what is possible, drawn in
// the game's own art (approved mockup): (1) one node-to-node ramp,
// (2) a two-ramp chain across three rows, with the mouse already
// ON the first ramp while the second is drawn (Larry 2026-11-10:
// the rule is you can draw the next line while he is climbing
// the first — he finishes the first ramp, then takes the second),
// (3) a flat node-to-node bridge. Each picture shows the green
// line, its x delete badge, and the ☝ pointing hand (Larry's pick)
// on the ending node.
// The modal is DOM only — opening or closing it never touches S.
let helpOpen = false, capDrawn = 0;
const helpModal = (typeof document !== 'undefined' && document.getElementById) ? document.getElementById('helpModal') : null;
const helpCanvases = [1, 2, 3].map(i => (typeof document !== 'undefined' && document.getElementById) ? document.getElementById('cap' + i) : null);
function capSky(c, W, H){
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#eaf6ff'); g.addColorStop(1, '#fdfdf8');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // one soft cloud, same shape as the game's
  c.fillStyle = 'rgba(255,255,255,0.9)';
  c.beginPath(); c.ellipse(W * 0.72, 34, 36, 13, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(W * 0.72 - 14, 26, 13, 0, Math.PI * 2); c.arc(W * 0.72 + 12, 23, 16, 0, Math.PI * 2); c.fill();
}
function capPlat(c, x1, y, x2){
  // a pill platform, same look as the game's (radius 7, pale-yellow outline, top strip)
  const r = 7, w = x2 - x1, h = 14;
  c.beginPath();
  c.moveTo(x1 + r, y); c.lineTo(x1 + w - r, y); c.quadraticCurveTo(x1 + w, y, x1 + w, y + r);
  c.lineTo(x1 + w, y + h); c.lineTo(x1, y + h); c.lineTo(x1, y + r); c.quadraticCurveTo(x1, y, x1 + r, y);
  c.closePath();
  c.fillStyle = '#8a6f4d'; c.fill();
  c.strokeStyle = 'rgba(255,224,130,0.55)'; c.lineWidth = 2; c.stroke();
  c.save(); c.clip();
  c.fillStyle = '#b08d5f'; c.fillRect(x1 + 2, y, w - 4, 5);
  c.restore();
}
function capNode(c, x, y, green){
  // a node dot: orange with a thick light-peach outline, or green
  // with a light-green border once a line has snapped into it
  c.beginPath(); c.arc(x, y, 17, 0, Math.PI * 2);
  c.fillStyle = green ? '#a5d6a7' : '#ffc98a'; c.fill();
  c.beginPath(); c.arc(x, y, 11, 0, Math.PI * 2);
  c.fillStyle = green ? '#1e7d32' : '#ff7a1a'; c.fill();
}
function capLockRing(c, x, y){
  c.beginPath(); c.arc(x, y, 19, 0, Math.PI * 2);
  c.strokeStyle = '#3a86ff'; c.lineWidth = 2.5; c.stroke();
}
function capSnapRing(c, x, y){
  c.beginPath(); c.arc(x, y, 20, 0, Math.PI * 2);
  c.strokeStyle = '#a5d6a7'; c.lineWidth = 2.5; c.stroke();
}
function capLine(c, ax, ay, bx, by){
  c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by);
  c.strokeStyle = '#1e7d32'; c.lineWidth = 8; c.lineCap = 'round'; c.stroke();
}
function capBadge(c, mx, my){
  // the x delete badge, same as the game's kept lines
  c.beginPath(); c.arc(mx, my, 13, 0, Math.PI * 2);
  c.fillStyle = '#fff'; c.fill();
  c.lineWidth = 2; c.strokeStyle = '#333'; c.stroke();
  c.fillStyle = '#333'; c.font = 'bold 18px sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('×', mx, my + 1);
}
function capHand(c, x, y){
  // the pointing hand (Larry's pick: the ☝ emoji), fingertip
  // touching the node from below
  c.font = '28px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText('☝', x, y + 4);
}
function capMouse(c, x, y){
  // the mouse himself, on the ramp — the game's own run sprite,
  // feet on the line, upright as in the game (not tilted to the
  // ramp). Falls back to a simple grey silhouette when the sprite
  // has not loaded yet (and in the harness, where Image is a
  // stub), so the picture always shows him on the ramp.
  const img = IMG['mouse-right-run-2.png'];
  if (img && img.naturalWidth){
    const dw = 44, dh = dw * 560 / 720;
    c.drawImage(img, x - dw * 0.479, y - dh * 0.90, dw, dh);
  } else {
    capMouseFallback(c, x, y);
  }
}
function capMouseFallback(c, x, y){
  // simple grey mouse silhouette, feet on the line at (x, y),
  // facing right — only when the sprite has not loaded yet
  c.fillStyle = '#8d8d8d';
  c.beginPath(); c.ellipse(x, y - 12, 20, 11, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x + 16, y - 16, 9, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x + 12, y - 26, 5, 0, Math.PI * 2); c.arc(x + 20, y - 27, 5, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#8d8d8d'; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x - 18, y - 8); c.quadraticCurveTo(x - 30, y - 12, x - 34, y - 4); c.stroke();
  c.fillStyle = '#333';
  c.beginPath(); c.arc(x + 19, y - 18, 2, 0, Math.PI * 2); c.fill();
}
function drawCap1(){
  const cv = helpCanvases[0]; if (!cv) return;
  const c = cv.getContext('2d'); if (!c) return;
  capSky(c, 360, 240);
  capPlat(c, 20, 183, 170); capPlat(c, 210, 103, 340);
  capLine(c, 170, 190, 210, 110);
  capBadge(c, 190, 150);
  capNode(c, 170, 190, false); capLockRing(c, 170, 190);
  capNode(c, 210, 110, true); capSnapRing(c, 210, 110);
  capHand(c, 210, 110);
  capDrawn++;
}
function drawCap2(){
  const cv = helpCanvases[1]; if (!cv) return;
  const c = cv.getContext('2d'); if (!c) return;
  capSky(c, 360, 240);
  capPlat(c, 20, 200, 140); capPlat(c, 170, 140, 290); capPlat(c, 200, 80, 340);
  capLine(c, 140, 207, 170, 147);
  capLine(c, 290, 147, 200, 87);
  // the mouse is already ON the first ramp, one-third up, with the
  // flashing green node (170,147) clearly IN FRONT of him — he is
  // climbing toward it, not on top of it (Larry 2026-11-10) — while
  // the second ramp is drawn. The rule: you can draw the next line
  // while he is climbing the first; he finishes the first ramp,
  // then takes the second. The mouse is drawn LAST, on top of
  // everything — including the × badge (Larry 2026-11-10).
  capBadge(c, 155, 177); capBadge(c, 245, 117);
  capNode(c, 140, 207, false); capLockRing(c, 140, 207);
  capNode(c, 170, 147, true); capSnapRing(c, 170, 147);
  capNode(c, 290, 147, false);
  capNode(c, 200, 87, true); capSnapRing(c, 200, 87);
  capHand(c, 200, 87);
  capMouse(c, 150, 187);
  capDrawn++;
}
function drawCap3(){
  const cv = helpCanvases[2]; if (!cv) return;
  const c = cv.getContext('2d'); if (!c) return;
  capSky(c, 360, 240);
  capPlat(c, 20, 160, 150); capPlat(c, 230, 160, 340);
  capLine(c, 150, 167, 230, 167);
  capBadge(c, 190, 167);
  capNode(c, 150, 167, false); capLockRing(c, 150, 167);
  capNode(c, 230, 167, true); capSnapRing(c, 230, 167);
  capHand(c, 230, 167);
  capDrawn++;
}
function drawCaps(){ drawCap1(); drawCap2(); drawCap3(); }
function openHelp(){
  helpOpen = true;
  if (helpModal) helpModal.style.display = 'block';
  drawCaps();
}
function closeHelp(){
  helpOpen = false;
  if (helpModal) helpModal.style.display = 'none';
}
(function wireHelpUI(){
  if (typeof document === 'undefined' || !document.getElementById) return;
  const btn = document.getElementById('helpBtn');
  if (btn && btn.addEventListener) btn.addEventListener('click', openHelp);
  const close = document.getElementById('helpClose');
  if (close && close.addEventListener) close.addEventListener('click', closeHelp);
  const gotIt = document.getElementById('helpGotIt');

// ---------- draw ----------
function rrect(x, y, w, h, r){

      ctx.beginPath(); ctx.arc(n.x, n.y, NODE_DRAW + 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffc98a'; ctx.fill();

  else src = frames[Math.floor(S.runT / 0.11) % frames.length];

// Test hook (smoke only — the harness loads endless; this lets a
