<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mousy Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#eaf6ff;
    font-family:-apple-system, system-ui, sans-serif; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #game { position:fixed; inset:0; display:block; }
  /* White veil (Jack 2026-11-06): the living world sits behind a
     soft translucent white wash — not darkened — so the title,
     best score and buttons read clearly over the moving demo.
     It sits above the canvas (z-index 4) and below the UI (5),
     and it blocks taps reaching the canvas (the demo is
     autonomous; the only controls are PLAY and Guide). */
  #veil { position:fixed; inset:0; background:rgba(255,255,255,.48); z-index:4; }
  /* Title (mockup 1's title, Jack 2026-11-06): Luckiest Guy,
     bright gold gradient with a dark brown outline and a soft
     drop shadow — the same gold as the endless points number. */
  #title { position:fixed; left:0; right:0; top:calc(28px + env(safe-area-inset-top));
    text-align:center; z-index:5; pointer-events:none; line-height:1; }
  #titleText { font-family:'Luckiest Guy','Arial Black',sans-serif; font-size:60px;
    background:linear-gradient(180deg,#FFF176 0%,#FFD54F 45%,#FFB300 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:2px #7A4A00; filter:drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
  /* Best score, directly below the title (Jack 2026-11-06). */
  #best { position:fixed; left:0; right:0; top:calc(100px + env(safe-area-inset-top));
    text-align:center; z-index:5; pointer-events:none; }
  #bestPill { display:inline-block; font-family:'Luckiest Guy','Arial Black',sans-serif;
    font-size:20px; color:#7A4A00; background:rgba(255,248,234,.92);
    border:1px solid #c9b896; border-radius:999px; padding:5px 16px; }
  /* PLAY and Guide, centered on screen (Jack 2026-11-06): the
     same 58cqw-wide pill, same padding, same border and shadow.
     PLAY is the orange gradient; Guide is a very light shade of
     Play's orange. Both white font. */
  #homeBtns { position:fixed; left:0; right:0; top:50%; transform:translateY(-50%);
    z-index:5; display:flex; flex-direction:column; align-items:center; gap:16px;
    container-type:inline-size; }
  .homeBtn { display:block; width:58cqw; box-sizing:border-box; text-align:center;
    text-decoration:none; font-family:'Luckiest Guy','Arial Black',sans-serif;
    font-size:28px; color:#fff; padding:14px 0; border-radius:999px;
    border:2px solid rgba(0,0,0,.12); box-shadow:0 4px 0 rgba(0,0,0,.15), 0 8px 20px rgba(0,0,0,.12); }
  .homeBtn.play { background:linear-gradient(180deg,#ff9a3d 0%,#ff7a1a 50%,#f26c00 100%); }
  .homeBtn.train { background:linear-gradient(180deg,#ffe9d2 0%,#ffdcae 50%,#ffd09a 100%); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="veil"></div>
<div id="title"><span id="titleText">MOUSY RUN</span></div>
<div id="best"><span id="bestPill">BEST <span id="bestNum">0</span></span></div>
<div id="homeBtns">
  <a class="homeBtn play" href="endless.html">PLAY</a>
  <a class="homeBtn train" href="index.html">GUIDE</a>
</div>
<script>
"use strict";

// ============================================================
// MOUSY RUN — HOMESCREEN (2026-11-06, Jack's pick: Living
// World, mockup 5, as revised — big gold title, best score
// under it, PLAY and Guide centered over the living world).
//
// The world behind the UI is the ENDLESS engine itself, in
// demo/attract mode: the mouse climbs the endless rows by the
// game's own logic (see the demo driver below), using real
// lines through the engine's press/move/release — B snap, node
// snap, green checks, kept lines, spent fingers. Per climb it
// uses TWO lines (a ramp to the next platform's node, then a
// second line from that node to the next node on the next
// platform). Lines disappear only after he has exited them.
// He climbs until he disappears into the top, then re-emerges
// from the bottom and continues in a loop.
//
// PLAY goes to the endless game, Guide to the training ground.
// The best score (localStorage 'mousyRunBest', written by the
// endless game on death) sits under the title. The world is
// washed with a white translucent veil, not darkened; there is
// no ground strip / base line on this screen. No death, no
// follow, no points HUD, no Reset/LOG chrome — the demo is
// the whole screen behind the UI.
// ============================================================
const DEMO = true;
const CFG = {
  speed: 0,            // derived below from the speed formula s/a = L/h (Jack 2026-11-05)
  gravity: 1900,       // px/s^2 while falling
  climb: 54,           // px he can step up/down onto a ramp edge (~finger thickness)
  transfer: 40,        // px ledge-height tolerance stepping off a ramp
  faceH: 14,           // drawn platform height — a line ending on the platform's visible face counts as connecting
  edgeSnap: 48,        // px: a ramp's far end may miss a platform's edge by this much and still count as landing on it
  snapR: 64,          // B: auto-snap radius — a drawn endpoint within this of his platform / an edge above snaps to it
  maxRampDeg: 88,      // Jack 2026-11-05: so long as the line isn't vertical, it should be good — only a line within 1.5deg of vertical is rejected (was 70)
  lookahead: 400,      // px of generated rows kept above the screen top
  halfW: 27,           // mouse body half-width for support/collision
  bodyH: 66,           // mouse body height
  drawW: 104,          // sprite draw width (canvas art is 720x560)
};

const SPRITES = {
  idleR: 'mouse-right.png', idleL: 'mouse-left.png',
  runR: ['mouse-right-run-1.png','mouse-right-run-2.png','mouse-right-run-3.png','mouse-right-run-2.png'],
  runL: ['mouse-left-run-1.png','mouse-left-run-2.png','mouse-left-run-3.png','mouse-left-run-2.png'],
};
const IMG = {};
Object.values(SPRITES).flat().forEach(src => { const i = new Image(); i.src = src; IMG[src] = i; });

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = innerWidth, H = innerHeight;
function fitCanvas(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ---------- world (endless) ----------
let groundY = 0, platforms = [], rows = [];
let scrolling = false, bestRow = 0, points = 0; // points: Flappy-style score (Jack 2026-11-06) — highest row reached, each row counting once
let clouds = []; // soft rounded clouds (Jack 2026-11-06) — screen-space decoration, behind everything
const SCROLL_A = 60; // px/s, fixed frame scroll — slowed 50% from 120 (Jack 2026-11-05)
// Equal row spacing (Jack 2026-11-04): every row is 192px
// apart (was random 96–288px).
const ROW_H = 192;
// Speed formula, capped platform (Jack 2026-11-05): the mouse
// speed no longer depends on W. His premise L = (W-g)+d made s
// grow with the screen (445 on his iPad vs 158 on his iPhone),
// so the run is now capped at the longest platform the
// generator actually builds: M = 220 (single-gap segMax). L =
// M+d — run one capped segment then climb the diagonal d =
// sqrt(h^2+g^2) — in the same time the scroll advances one row
// (h/a). So s/a = L/h, i.e. s = a*L/h. g is still the minimum
// gap (100px). s = 136 at a=60, on every screen width; h stays
// 192, a stays 60. The per-row cap (s*h/a) is now also
// W-independent (~435), so the generator's gap-chain
// acceptance actually bites on wide screens too (on the iPad
// build it never bound, because the budget exceeded the
// screen). Wider screens just tile more segments/gaps per row;
// the mouse never has to cross the whole width.
const GAP_G = 100; // minimum gap, px — the constant g in the speed formula
const PLATFORM_CAP = 220; // M: longest segment the generator builds (single-gap segMax) — the capped platform run
const PATH_D = Math.sqrt(ROW_H * ROW_H + GAP_G * GAP_G); // diagonal, 216.5 at h=192, g=100
const PATH_L = PLATFORM_CAP + PATH_D; // full path, 436.5 at M=220 — no W in it
const SPEED_RATIO = PATH_L / ROW_H; // ~2.27
CFG.speed = Math.round(SCROLL_A * SPEED_RATIO); // 136 at a=60, on any screen width
const FOOTPRINT = 1 / Math.tan(CFG.maxRampDeg * Math.PI / 180); // ~0.035: horizontal run a max-slope climb needs (was ~0.364 at 70deg)
const rnd = (a, b) => a + Math.random() * (b - a);

// Random row gaps — same rules as stress_test.py: segments >= 60px,
// gaps >= 100px, tiling the full width W. Gap widths are
// inconsistent on purpose (Jack 2026-11-01): single-gap rows
// draw gaps in [100,260]px (was [100,170]px), and ~40% of rows
// are multi-gap rows — smaller pieces so two gaps fit (phone
// widths fit at most two: 2 gaps + 3 segments need 380px at the
// floors, so a third gap cannot fit without breaking a floor).
// The worst-travel acceptance in genRow still gates every row,
// so varied and multi-gap rows stay winnable.
function genRowGaps(){
  // The multi/single roll is per CALL, not per attempt: a
  // single-gap draw succeeds almost immediately, so rolling
  // inside the retry loop lets single draws crowd out every
  // multi draw before it gets its attempts (a first pass with
  // the roll inside produced 9 multi rows in 2000 calls).
  const multi = Math.random() < 0.4;
  for (let attempt = 0; attempt < 200; attempt++){
    // Multi-gap pieces stay near the floors on purpose: two gaps
    // (100px each) plus three segments (60px each) already need
    // 380px, leaving only 10px of slack on a 390px screen (50px
    // on a 430px phone) — wider multi pieces almost never fit,
    // which is why a first pass with roomy ranges produced zero
    // multi-gap rows in 2000 generated rows.
    // Multi-gap pieces grow with screen width (Jack 2026-11-06):
    // on a phone they must stay near the floor — two gaps (100px
    // each) plus three pieces (60px each) need 380px minimum — but
    // on a wide screen the same small pieces chop every row into
    // stubs. The slack over a 390px phone is shared across the
    // three pieces, capped at PLATFORM_CAP so no drawn piece ever
    // exceeds the formula's M (and the mouse speed never changes).
    // At 390px this is exactly 80, as before; at 810px and up it
    // reaches the 220 cap. (The trailing platform can still run
    // longer: when a gap doesn't fit at the row's end, the last
    // two drawn pieces merge into one platform — pre-existing.)
    const segMax = multi ? Math.min(PLATFORM_CAP, 80 + Math.max(0, W - 390) / 3) : PLATFORM_CAP; // single-gap max IS the formula's M, so the cap and the generator can't drift
    const gapMax = multi ? 120 : 260;
    const parts = []; let x = 0, ok = true;
    while (x < W - 1e-9){
      const seg = rnd(60, segMax);
      if (x + seg >= W){ if (W - x >= 60) parts.push(['seg', W - x]); else ok = false; x = W; break; }
      parts.push(['seg', seg]); x += seg;
      const gap = rnd(100, gapMax);
      if (x + gap >= W - 60){
        // the trailing segment must still hold him (>= 60px) —
        // without this guard a segment landing near the edge
        // could leave a sub-60px sliver, and wider gaps make
        // that more likely
        if (W - x >= 60) parts.push(['seg', W - x]); else ok = false;
        x = W; break;
      }
      parts.push(['gap', gap]); x += gap;
    }
    if (!ok) continue;
    const gaps = []; let xx = 0;
    for (const [kind, ln] of parts){ if (kind === 'gap') gaps.push({ c: xx + ln / 2, w: ln }); xx += ln; }
    if (!gaps.length) continue;
    if (multi && gaps.length < 2) continue;
    if (gaps.every(g => g.w >= 100)) return gaps;
  }
  return null;
}
function worstTravel(prev, next, h){
  let disp = 0;
  for (const p of prev){
    let nearest = Infinity;
    for (const q of next) nearest = Math.min(nearest, Math.abs(q.c - p.c));
    disp = Math.max(disp, nearest);
  }
  return Math.max(disp, h * FOOTPRINT);
}
// One row above topY, accepted only if worst travel <= s*h/a vs the
// previous row's gaps. Fallback: repeat the previous row's gaps,
// which always passes (travel = footprint only).
function genRow(prevGaps, topY, idx){
  const h = ROW_H;
  const limit = CFG.speed * h / SCROLL_A;
  for (let tries = 0; tries < 100; tries++){
    const gaps = genRowGaps();
    if (!gaps) continue;
    if (worstTravel(prevGaps, gaps, h) <= limit) return pushRow(gaps, topY - h, idx);
  }
  return pushRow(prevGaps.map(g => ({ c: g.c, w: g.w })), topY - h, idx);
}
function pushRow(gaps, y, idx){
  const row = { y, idx, gaps };
  rows.push(row);
  let cur = 0;
  for (const g of gaps){
    const left = g.c - g.w / 2;
    if (left > cur + 1) platforms.push({ x1: cur, x2: left, y, row: idx });
    cur = Math.max(cur, g.c + g.w / 2);
  }
  if (W - cur > 1) platforms.push({ x1: cur, x2: W, y, row: idx });
  return row;
}
function buildWorld(){
  groundY = H - 44;
  platforms = []; rows = []; scrolling = false; bestRow = 0; points = 0;
  // clouds (Jack 2026-11-06): four soft rounded whites in fixed
  // height bands across the upper sky, drifting slowly left in
  // screen space — decoration only, never part of the world (no
  // scroll/follow, no collision). Fresh sky on every Reset/resize.
  clouds = [0.08, 0.20, 0.33, 0.45].map((fy, i) => ({
    x: Math.random() * W, y: Math.round(H * fy),
    s: [1.0, 0.8, 1.15, 0.9][i], v: 10 + (i % 3) * 3, // px/s, slow drift left
    a: [0.95, 0.85, 0.9, 0.8][i],
  }));
  let prevGaps = [{ c: 70, w: 100 }]; // virtual: where he starts on the ground
  let topY = groundY, idx = 0;
  while (topY > -CFG.lookahead){
    idx++;
    const row = genRow(prevGaps, topY, idx);
    prevGaps = row.gaps; topY = row.y;
  }
  setScore();
}
function setScore(delta){
  const el = document.getElementById('pointsNum');
  if (el){
    el.textContent = points;
    if (delta > 0){
      // pop + sparkle burst (Jack 2026-11-06)
      if (el.animate) el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)', offset: 0.4 }, { transform: 'scale(1)' }], { duration: 300 });
      burstSparkles(el);
    }
  }
  if (delta > 0) logEvent('POINT', '+' + delta + ' total=' + points);
}
function burstSparkles(el){
  // Six gold sparkles fly out from the number and fade (~600ms).
  // Guarded throughout: the Node harness stubs document without
  // createElement, and stub elements without animate/appendChild,
  // so in tests this is a silent no-op.
  if (typeof document === 'undefined' || typeof document.createElement !== 'function' || typeof el.appendChild !== 'function') return;
  const dirs = [[-48,-36],[48,-36],[-54,8],[54,8],[-30,40],[30,40]];
  for (const [dx, dy] of dirs){
    const s = document.createElement('span');
    if (!s) continue;
    s.className = 'spark';
    el.appendChild(s);
    if (typeof s.animate === 'function'){
      const anim = s.animate([
        { opacity: 0, transform: 'translate(0px,0px) scale(0.4) rotate(0deg)' },
        { opacity: 1, transform: 'translate(' + Math.round(dx * 0.3) + 'px,' + Math.round(dy * 0.3) + 'px) scale(1) rotate(30deg)', offset: 0.25 },
        { opacity: 0, transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1) rotate(90deg)' }
      ], { duration: 600, easing: 'ease-out' });
      if (anim) anim.onfinish = () => { if (typeof s.remove === 'function') s.remove(); };
    } else if (typeof s.remove === 'function'){
      s.remove();
    }
  }
}
buildWorld();
fitCanvas();
addEventListener('resize', () => {
  // Only rebuild the world when the WIDTH changes (a real orientation
  // change). A height-only change is iOS Safari's URL bar hiding or
  // showing when Jack taps the screen — rebuilding there regenerates
  // every platform at random, so the platforms visibly jump. A height
  // change just resizes the canvas; the world stays put.
  const newW = innerWidth, newH = innerHeight;
  if (newW !== W){ W = newW; H = newH; buildWorld(); fitCanvas(); demoReset(); }
  else { H = newH; fitCanvas(); }
});

// ---------- state ----------
const GROUND = { type: 'ground' };
const S = {
  x: 70, y: 0, dir: 1, vy: 0,
  mode: 'run',              // run | fall | lost
  surface: GROUND,          // GROUND | platform obj | {type:'finger'}
  runT: 0,
  finger: null,             // {x,y,rx,ry,rot, dragA, ox,oy}
  steerDone: false,         // this press has done its steering (he mounted it or bumped it)
  spentFinger: null,        // the finger whose press is spent — set only when ITS (live) line is disembarked, departed, or crossed; a different finger is never spent by it (a kept line's exit spends no finger)
  verticalFall: false,      // falling straight down after a ramp crossing (x locked until landing)
  rampOrigin: null,         // surface he mounted the current ramp from (its line never blocks him)
  fallExclude: null,        // platform a vertical fall must pass to land strictly below it (the crossed one)
  fallFrom: null,           // platform he ran off (for the fall-landing gate: a finger line is only landable while falling if it touches the surface he fell from)
  rampDir: 1,               // committed ramp direction, locked at mount — nothing turns him mid-ramp
  rampFinger: null,           // finger object he mounted the current ramp with (a new press replacing a LIVE line drops him, it never snaps him; a kept line stays — drawing another while embarked doesn't jump him off)
  keptSeg: null,            // first line left behind after lifting — stays until used up or deleted (two-line rule: at most two lines on screen)
  keptSeg2: null,           // second kept line, if one was drawn while the first was still up
  rampSlot: null,           // which kept slot he is climbing (1, 2) or 'live' — so releasing mid-climb doesn't switch him to the other kept line
  deletePress: false,        // this press tapped the kept line's circled x: it deletes, it doesn't draw
};
S.y = groundY;

// ---------- play log (Jack 2026-10-27: monitoring session) ----------
// Every decision the engine makes, in one place: when a defect
// happens, tap LOG and paste this into chat — it pins the exact
// frame, segment, and decision instead of a description. Capped at
// 400 events (oldest drop off); game coordinates only, no personal
// data. The LOG button is DOM above the canvas, so tapping it
// never registers as a game press.
const LOG = [];
let LT = 0, lastGreen = null, LOG_STARTED = false;
const LOG_CAP = 400;
function platStr(p){
  if (!p) return 'none';
  if (p.type === 'ground') return 'ground';
  if (p.type === 'finger') return 'finger';
  if (p.type === 'air') return 'air';
  return '[' + p.x1 + ',' + p.x2 + ']@' + p.y + (p.row ? ' row' + p.row : '');
}
function segStr(s){
  return s ? '(' + Math.round(s.ax) + ',' + Math.round(s.ay) + ')-(' + Math.round(s.bx) + ',' + Math.round(s.by) + ')' : 'none';
}
function logEvent(kind, msg){
  LOG.push(LT.toFixed(2) + 's ' + kind + ' ' + msg);
  while (LOG.length > LOG_CAP) LOG.shift();
}

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

// ---------- finger geometry ----------
// Ramp from the touch's own path (see FIX 2): start point ->
// current point, extended to a usable ramp length.
function trajSegment(f){
  if (!f || !f.anchor || !f.dragging) return null;
  const dx = f.x - f.anchor.x, dy = f.y - f.anchor.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 20) return null;
  const len = Math.max(dist, 150), ux = dx / dist, uy = dy / dist; // a drawn line runs as long as drawn — no cap
  return { ax: f.anchor.x, ay: f.anchor.y, bx: f.anchor.x + ux * len, by: f.anchor.y + uy * len, len };
}
// Ramp from the contact patch ellipse (still-lay fallback).
function patchSegment(f){
  const major = Math.max(f.rx, f.ry), minor = Math.min(f.rx, f.ry);
  const ratio = minor > 0 ? major / minor : 1;
  // a ramp is a big contact, or a clearly elongated one; a small
  // round-ish patch stays a fingertip
  if (!(major >= 54 || (major >= 32 && ratio >= 1.35))) return null;
  const ang = ((f.rx >= f.ry ? f.rot : f.rot + 90) * Math.PI) / 180;
  // the reported patch is only the contact core — extend along the
  // finger's axis to a usable ramp length
  const half = clamp(major * 1.1, 85, 190);
  return {
    ax: f.x - Math.cos(ang) * half, ay: f.y - Math.sin(ang) * half,
    bx: f.x + Math.cos(ang) * half, by: f.y + Math.sin(ang) * half,
    len: half * 2,
  };
}
function liveSegment(){
  const f = S.finger; if (!f) return null;
  if (f.dragA){
    const dx = f.x - f.dragA.x, dy = f.y - f.dragA.y;
    const len = Math.hypot(dx, dy);
    if (len < 40) return null;
    const cap = len, ux = dx / len, uy = dy / len; // a drawn line runs as long as drawn — no cap
    return { ax: f.dragA.x, ay: f.dragA.y, bx: f.dragA.x + ux * cap, by: f.dragA.y + uy * cap, len: cap };
  }
  const traj = trajSegment(f);
  if (traj) return traj; // the path he actually made IS the finger — it always wins
  return patchSegment(f);
}
// The effective line: a live finger's line if it has one (which
// supersedes any kept line), else the kept line left behind
// after lifting — lines stay until used up or deleted.
// Drop one kept line by identity, promoting the second into the
// first slot so slot 1 is always the active kept line. A live line
// (not kept) is untouched — it was never in a slot.
function clearKept(seg){
  if (seg === S.keptSeg){ S.keptSeg = S.keptSeg2; S.keptSeg2 = null; }
  else if (seg === S.keptSeg2){ S.keptSeg2 = null; }
}
// ---------- B: auto-snap (endless only, Jack 2026-10-27) ----------
// A (the MVP behavior) uses the drawn line exactly. B snaps a drawn
// line to real anchors when both ends are actually aimed near them:
// the start end to the nearest point on the platform he stands on,
// the far end to the nearest EDGE of a platform above. Both ends
// must qualify, the snapped line must be climbable and must not
// run through a platform, or there is no snap and the line stays
// exactly as drawn — random scribbles never snap into place.
// The snapped line locks for this press once he is on it or
// falling toward it (recomputing mid-climb would jump him between
// targets); the lock is keyed by finger object, so a new press
// always re-evaluates. A raw climbed line keeps morphing as today.
let snapLock = null;
let startLock = null; // Jack 2026-10-28: the line's start, locked at finger-down to his platform (a world point); rides scroll/follow even off-screen; only the end is drag-controlled
let nodeLock = null; // Jack 2026-10-29 (from the Line Lab): the line's start, locked at press to a NODE (a platform end leading to a gap), exactly; rides scroll/follow like startLock; the far end snaps to a node it ends in
let lastNodeFarKey = null; // snapped far node identity, for once-per-node SNAP logging
let snapFlash = null; // node the line just snapped into, for the one-time snap flash (Jack 2026-11-02)
const NODE_R = 28;    // node snap radius (lab parity)
const NODE_DRAW = 11; // node circle radius on screen
function snapCrosses(snapped, fromX, dir){
  if (snapped.by === snapped.ay) return false;
  for (const p of platforms){
    const t = (p.y - snapped.ay) / (snapped.by - snapped.ay);
    if (t <= 0 || t >= 1) continue;
    const x = snapped.ax + (snapped.bx - snapped.ax) * t;
    if (x < p.x1 - 2 || x > p.x2 + 2) continue;
    if (dir > 0 && x <= fromX) continue;
    if (dir < 0 && x >= fromX) continue;
    return true;
  }
  return false;
}
function snapLive(seg){
  let anchor = null;
  if (S.surface.type === 'finger') anchor = S.rampOrigin;

            S.surface = { type: 'air' };

            // ran off the ramp's far edge: step onto a touching ledge, else fall

            const endY = segYAt(seg, endX);
            // shared landing check (the same one green uses): step
            // onto a touching ledge (exact, snap, or step-up), drop
            // vertically onto a platform below, or fall

    // bypassed count too), and each row counts only once, so points
    // is the highest row reached. bestRow stays as the diagnostic
    // twin (SCROLL/DEATH logs, harness).
    if (S.mode === 'run' && S.surface.row && S.surface.row > bestRow){
      bestRow = S.surface.row;
      const delta = S.surface.row - points;
      points = S.surface.row;
      setScore(delta);
    }
    // scroll starts the first time he reaches mid-screen
    if (!scrolling && S.y <= H / 2){ scrolling = true; logEvent('SCROLL', 'start at y=' + Math.round(S.y) + ' rows=' + bestRow); }
    // follow: once scrolling, never let him rise above the middle —
    // translate the whole view (mouse + world) so he sits at middle.
    // A pure translation: relative geometry is unchanged.
    if (!DEMO && scrolling && S.mode !== 'lost' && S.y < H / 2){
      const d = H / 2 - S.y;
      groundY += d;
      for (const p of platforms) p.y += d;
      for (const r of rows) r.y += d;
      if (S.keptSeg){ S.keptSeg.ay += d; S.keptSeg.by += d; }
      if (S.keptSeg2){ S.keptSeg2.ay += d; S.keptSeg2.by += d; }
      if (startLock) startLock.sy += d;
      if (nodeLock) nodeLock.sy += d;
      S.y += d;
    }
  }

  demoUpdate(dt);
  draw(now);
  requestAnimationFrame(tick);
}


// ---------- homescreen demo (attract mode) ----------
// The Living World demo (Jack 2026-11-06): the mouse climbs
// the endless world by the GAME'S OWN LOGIC. An auto-driver
// draws real lines through the engine's own press/move/release
// (B snap, node snap, green checks, kept lines, spent fingers),
// then lets the engine run/climb/fall him. Per climb it uses
// TWO lines: a green ramp from his feet up to the next
// platform's node, then a second green line from that node up
// to the next node on the next platform (a two-ramp chain
// upward). Lines disappear only after he has exited them —
// the engine's kept-line rule keeps a line whole until its
// exit, never shrunk while he climbs. He climbs until he
// disappears into the top, then re-emerges from the bottom and
// continues in a loop. No death, no follow (the follow would
// pin him at mid-screen and he could never leave through the
// top), no points HUD.
let demoState = 'idle'; // idle | draw1 | draw2 | wait
let demoPair = null;    // { footX, footY, surf, fromRow, n1, n2 }
let demoDrawFrom = null;   // { x, y } where the current draw started
let demoWaitT = 0;
let demoWraps = 0;      // times he left through the top/bottom and re-emerged
let demoTopWraps = 0;   // of those, times he left through the TOP (the intended loop)
let demoClimbs = 0;     // pairs fully climbed (two rows up)

function demoRowOf(surf){ return surf && surf.row ? surf.row : 0; }
function demoNodesOnRow(row){ return allNodes().filter(n => n.plat.row === row); }
// A node's CURRENT position: allNodes() snapshots y at call time,
// but the world scrolls, so a stored node's y goes stale within a
// draw — read it from the live platform instead.
function demoNodeXY(n){ return { x: n.x, y: n.plat.y + CFG.faceH / 2 }; }
function demoNearNode(x, y){
  for (const n of allNodes()){
    if (Math.hypot(x - n.x, y - n.y) <= 28) return true;
  }
  return false;
}
function demoNearBadge(x, y){
  for (const k of [S.keptSeg, S.keptSeg2]){
    if (!k) continue;
    const mx = (k.ax + k.bx) / 2, my = (k.ay + k.by) / 2;
    if (Math.hypot(x - mx, y - my) <= 28) return true;
  }
  return false;
}
// The exit must land ON the node's platform in the direction he
// will actually run (foot -> node): the engine steps 4px past the
// far end in that direction, and a node at the platform's edge
// approached from the wrong side steps him off it — the two falls
// in the first diagnostic were exactly this (a left-edge node
// approached from the right, exit 4px past the edge).
function demoExitOK(n, fromX){
  const dir = Math.sign(n.x - fromX) || 1;
  const exitX = n.x + dir * 4;
  const p = n.plat;
  return exitX >= p.x1 && exitX <= p.x2;
}
// A foot is usable only if it is far enough from him that the
// fresh press cannot bump him (the engine's fingertip blocker
// fires when his front reaches within 22px of the press point,
// and he covers halfW 27 + up to 4.5px per tick — so 55px clear)
// and not on top of a node (a press within 28px of a node locks
// the line's start to that node instead of the foot).
function demoFootOK(x, y){
  return Math.abs(x - S.x) > 55 && !demoNearNode(x, y) && !demoNearBadge(x, y);
}
function demoFindPair(){
  const surf = S.surface;
  if (!surf || surf.type === 'finger' || surf.type === 'air') return null;
  const hisRow = demoRowOf(surf);
  const surfY = surf.type === 'ground' ? groundY : surf.y;
  // On the ground he can only run between the wall turns (28,
  // W-28) — a foot past a turn is unmountable, because he must
  // approach it from the far side of the foot, so the reachable
  // range, not the whole screen, is the foot range.
  const surfX1 = surf.type === 'ground' ? 28 : surf.x1;
  const surfX2 = surf.type === 'ground' ? W - 28 : surf.x2;
  const n1s = demoNodesOnRow(hisRow + 1);
  const n2s = demoNodesOnRow(hisRow + 2);
  if (!n1s.length || !n2s.length) return null;
  // N1: prefer the node whose edge faces him (he approaches a
  // node from outside its platform, so the exit steps back onto
  // it — a left-edge node approached from the left, a right-edge
  // node from the right), then nearest.
  n1s.sort((a, b) => {
    const aGood = (a.edge === 'left' && a.x > S.x) || (a.edge === 'right' && a.x < S.x) ? 0 : 1;
    const bGood = (b.edge === 'left' && b.x > S.x) || (b.edge === 'right' && b.x < S.x) ? 0 : 1;
    return (aGood - bGood) || (Math.abs(a.x - S.x) - Math.abs(b.x - S.x));
  });
  for (const n1 of n1s){
    const toN1 = Math.sign(n1.x - S.x) || 1;
    // Feet spread across his platform, nearest first — the
    // bump-safe ones (demoFootOK) are the only ones that will
    // not shove him off a small platform the moment they land.
    const feet = [
      clamp(S.x + toN1 * Math.min(50, Math.abs(n1.x - S.x) * 0.6), surfX1 + 8, surfX2 - 8),
      clamp(n1.x, surfX1 + 8, surfX2 - 8),
      surfX1 + 8, surfX2 - 8,
      surfX1 + (surfX2 - surfX1) * 0.25, surfX1 + (surfX2 - surfX1) * 0.75,
      surfX1 + (surfX2 - surfX1) * 0.5,
      clamp(S.x, surfX1 + 8, surfX2 - 8),
    ];
    for (const footX of feet){
      if (!demoFootOK(footX, surfY)) continue;
      const l1 = { ax: footX, ay: surfY, bx: n1.x, by: n1.y, len: Math.hypot(n1.x - footX, n1.y - surfY) };
      if (!segClimbable(l1)) continue;
      if (!segTouchesSurface(l1, surf)) continue;
      if (!keptLineWillLand(l1)) continue;
      if (!demoExitOK(n1, footX)) continue;
      // N2: prefer the node on the opposite side of N1 from his
      // exit direction along line 1 (he lands at N1 running that
      // way, so a far end on the far side lets him mount line 2
      // at once instead of running off the edge), then nearest.
      // The green check below enforces the matching edge, so the
      // exit steps back onto the platform.
      const dir1 = Math.sign(n1.x - footX) || 1;
      const sorted2 = n2s.slice().sort((a, b) => {
        const aOpp = Math.sign(a.x - n1.x) === -dir1 ? 0 : 1;
        const bOpp = Math.sign(b.x - n1.x) === -dir1 ? 0 : 1;
        return (aOpp - bOpp) || (Math.abs(a.x - n1.x) - Math.abs(b.x - n1.x));

        const l2 = { ax: n1.x, ay: n1.y, bx: n2.x, by: n2.y, len: Math.hypot(n2.x - n1.x, n2.y - n1.y), node: true };
        if (!keptLineWillLand(l2)) continue;
        if (!demoExitOK(n2, n1.x)) continue;

}
function demoReset(){

  S.verticalFall = false; S.rampOrigin = null; S.fallExclude = null; S.fallFrom = null; S.rampDir = 1; S.keptSeg = null; S.keptSeg2 = null; S.rampSlot = null; S.rampFinger = null; S.deletePress = false;

}
function demoWrap(fromTop){

}
function demoStepDraw(dt){
  if (!S.finger){ demoState = 'idle'; demoPair = null; return; }
  // the target node rides the scroll — re-read its live position
  // every tick, or the finger chases a stale point and the snap
  // (and the arrival check below) miss by the scrolled distance
  const isLine2 = demoState === 'draw2';
  const t = demoNodeXY(isLine2 ? demoPair.n2 : demoPair.n1);

  const dx = t.x - f.x, dy = t.y - f.y, d = Math.hypot(dx, dy);

  // tick, so the finger stops being a bare blocker before he can
  // reach it — a slow draw would let the fingertip bump shove him
  const step = 3000 * dt;
  if (d <= Math.max(step, 3)){
    moveFinger(t.x, t.y);
    const seg = fingerSegment();
    const surfY = demoPair.surf.type === 'ground' ? groundY : demoPair.surf.y;
    const n1 = demoNodeXY(demoPair.n1), n2 = demoNodeXY(demoPair.n2);
    const wantAx = isLine2 ? n1.x : demoPair.footX;
    const wantAy = isLine2 ? n1.y : surfY;
    const wantBx = isLine2 ? n2.x : n1.x;
    const wantBy = isLine2 ? n2.y : n1.y;
    const ok = seg && Math.abs(seg.ax - wantAx) <= 2 && Math.abs(seg.ay - wantAy) <= 2 &&
      Math.abs(seg.bx - wantBx) <= 2 && Math.abs(seg.by - wantBy) <= 2 &&
      keptLineWillLand(seg) && (!isLine2 ? segTouchesSurface(seg, demoPair.surf) : seg.node === true);

      release();
      if (isLine2){ demoState = 'wait'; demoWaitT = 0; }
      else {
        const at = demoNodeXY(demoPair.n1);
        press(at.x, at.y, 14, 14, 0, true);
        demoDrawFrom = { x: at.x, y: at.y };
        demoState = 'draw2';
      }
    } else {
      // abandon: collapse the live segment (a still finger draws
      // nothing), release keeps nothing new
      moveFinger(demoDrawFrom.x, demoDrawFrom.y);
      release();
      // a failed second line still leaves the first kept: wait
      // for him to climb it, then redraw from the new row
      if (isLine2){ demoState = 'wait'; demoWaitT = 0; }

function demoUpdate(dt){
  // wrap: he disappeared into the top, or fell below the bottom —
  // either way he re-emerges from the bottom and continues
  if (S.mode !== 'lost' && (S.y < -30 || S.y > H + 40)){ demoWrap(S.y < -30); return; }
  if (demoState === 'idle'){
    if (S.mode === 'run' && S.surface && (S.surface.type === 'ground' || S.surface.x1 !== undefined) && !S.keptSeg && !S.keptSeg2 && !S.finger){
      const pair = demoFindPair();
      if (pair){
        demoPair = pair;

        demoDrawFrom = { x: pair.footX, y: pair.footY };

      }

    demoStepDraw(dt);

    demoWaitT += dt;

      const row = demoRowOf(S.surface);
      if (row >= demoPair.fromRow + 2){ demoClimbs++; demoState = 'idle'; demoPair = null; }
      else if (row < demoPair.fromRow){ S.keptSeg = null; S.keptSeg2 = null; demoState = 'idle'; demoPair = null; }
      else if (!S.keptSeg && !S.keptSeg2){ demoState = 'idle'; demoPair = null; }
      else if (demoWaitT > 5){ S.keptSeg = null; S.keptSeg2 = null; demoState = 'idle'; demoPair = null; }
    }

}

// The endless game writes the best points here on death

(function showBest(){
  let best = 0;
  try { best = parseInt(localStorage.getItem('mousyRunBest') || '0', 10) || 0; } catch (e){}
  const el = document.getElementById('bestNum');
  if (el) el.textContent = best;
})();

// ---------- draw ----------
function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function draw(now){
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#eaf6ff'); grad.addColorStop(1, '#fdfdf8');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  // clouds: soft rounded whites drifting behind everything
  for (const c of clouds) drawCloud(c);

  // ground (once it has scrolled off the bottom, skip it)
  if (groundY < H){
    ctx.fillStyle = '#7a6248'; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#97b56a'; ctx.fillRect(0, groundY, W, 7);
  }

  // platforms — pill ends (Jack 2026-11-06: radius 7, fully rounded
  // on a 14px bar) with a faint transparent pale-yellow outline
  // (rgba(255,224,130,.55), 2px — the "little thicker" B). The top
  // strip is clipped to the bar so its square corners can't poke
  // past the rounded ends. Purely visual: p.x1/p.x2 are unchanged.
  for (const p of platforms){
    ctx.fillStyle = '#8a6f4d';
    rrect(p.x1, p.y, p.x2 - p.x1, 14, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,224,130,0.55)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save();
    rrect(p.x1, p.y, p.x2 - p.x1, 14, 7); ctx.clip();
    ctx.fillStyle = '#b08d5f';
    ctx.fillRect(p.x1 + 2, p.y, p.x2 - p.x1 - 4, 5);
    ctx.restore();
  }

  // nodes: orange circles with a thick lighter outline at
  // gap-facing platform ends (Jack 2026-10-29 dots, 2026-11-01
  // orange) — except a node a green line snaps into, which
  // turns dark green with a light green border (Jack
  // 2026-11-02). Ring the locked start node, and the node the
  // finger would snap to, so the lock/snap is visible first;
  // the rings sit outside the outline (NODE_DRAW + 9). A green
  // node needs no preview ring — the green node IS the signal.
  let farPreview = null;
  if (S.finger && nodeLock && nodeLock.finger === S.finger) farPreview = nearestNode(S.finger.x, S.finger.y, NODE_R, nodeLock.sx, nodeLock.sy);
  const greenSet = greenSnapNodes();
  for (const n of allNodes()){
    if (greenSet.has(n.x + ',' + n.y)){
      ctx.fillStyle = '#a5d6a7'; ctx.beginPath(); ctx.arc(n.x, n.y, NODE_DRAW + 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e7d32'; ctx.beginPath(); ctx.arc(n.x, n.y, NODE_DRAW, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#ffc98a'; ctx.beginPath(); ctx.arc(n.x, n.y, NODE_DRAW + 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.arc(n.x, n.y, NODE_DRAW, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (nodeLock && nodeLock.finger === S.finger){
    ctx.strokeStyle = '#3a86ff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(nodeLock.sx, nodeLock.sy, NODE_DRAW + 9, 0, Math.PI * 2); ctx.stroke();
  }
  if (farPreview && !greenSet.has(farPreview.x + ',' + farPreview.y)){
    ctx.strokeStyle = '#2a9d2a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(farPreview.x, farPreview.y, NODE_DRAW + 9, 0, Math.PI * 2); ctx.stroke();
  }
  // Snap flash (Jack 2026-11-02): one expanding, fading ring
  // + a brief bright glow on the node the line just snapped
  // into. ~250ms, then it settles into the node's state color
  // (green if the line is green, orange if amber).
  if (snapFlash){
    const age = performance.now() - snapFlash.t0;
    if (age < 250){
      const p = age / 250;
      const cur = allNodes().find(n => n.plat === snapFlash.plat && n.edge === snapFlash.edge);
      const fx = cur ? cur.x : snapFlash.x, fy = cur ? cur.y : snapFlash.y;
      ctx.strokeStyle = 'rgba(165,214,167,' + (1 - p).toFixed(3) + ')';
      ctx.lineWidth = 5 * (1 - p) + 1;
      ctx.beginPath(); ctx.arc(fx, fy, NODE_DRAW + 6 + p * 22, 0, Math.PI * 2); ctx.stroke();
      if (p < 0.5){
        ctx.fillStyle = 'rgba(255,255,255,' + ((0.5 - p) * 1.2).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(fx, fy, NODE_DRAW, 0, Math.PI * 2); ctx.fill();
      }
    } else snapFlash = null;
  }

  // finger: ramp segment or fingertip circle
  const seg = fingerSegment(), blocker = fingerBlocker();
  // Second kept line: drawn dimmer like any kept line, when it is
  // not already the active segment below (so both kept lines stay
  // visible even while a spent fall hides the active one).
  for (const k of [S.keptSeg, S.keptSeg2]){
    if (k && k !== seg){
      const lands = keptLineWillLand(k);
      ctx.strokeStyle = lands ? 'rgba(30,125,50,.6)' : 'rgba(255,205,140,.6)'; ctx.lineWidth = 16; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(k.ax, k.ay); ctx.lineTo(k.bx, k.by); ctx.stroke();
    }
  }
  if (seg){
    const kept = !S.finger && S.keptSeg;
    // a kept line that is not being climbed shows its own-anchor
    // green (keptLineWillLand); a live line, and a line being
    // climbed, keep the mount-promise green (lineWillLand)
    const isKept = seg === S.keptSeg || seg === S.keptSeg2;
    const climbing = S.surface && S.surface.type === 'finger';
    const lands = (isKept && !climbing) ? keptLineWillLand(seg) : lineWillLand(seg);
    // single stroke, NO outline, with ROUNDED caps (Jack
    // 2026-10-29). Cosmetic only: a round cap extends the
    // VISIBLE line 8px past each logical end (half the 16px
    // width), so a line can look like it touches a platform when
    // its logical end stops just short — the logical segment,
    // the green rule, and mount/exit are all unchanged, and the
    // color (not the cap) is what promises a connection.
    ctx.strokeStyle = lands ? (kept ? 'rgba(30,125,50,.6)' : 'rgba(30,125,50,.9)') : (kept ? 'rgba(255,205,140,.6)' : 'rgba(255,205,140,.9)'); ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(seg.ax, seg.ay); ctx.lineTo(seg.bx, seg.by); ctx.stroke();
  } else if (blocker){
    ctx.fillStyle = 'rgba(230,170,90,.5)';
    ctx.beginPath(); ctx.arc(blocker.x, blocker.y, blocker.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(200,140,70,.6)'; ctx.lineWidth = 2; ctx.stroke();
  }

  // delete badge on each kept line: a small circled x at its
  // midpoint — tapping it deletes that line (see press())
  if (S.keptSeg){
    const mx = (S.keptSeg.ax + S.keptSeg.bx) / 2, my = (S.keptSeg.ay + S.keptSeg.by) / 2;
    ctx.beginPath(); ctx.arc(mx, my, 13, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#333'; ctx.stroke();
    ctx.fillStyle = '#333'; ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×', mx, my + 1);
  }
  if (S.keptSeg2){
    const mx = (S.keptSeg2.ax + S.keptSeg2.bx) / 2, my = (S.keptSeg2.ay + S.keptSeg2.by) / 2;
    ctx.beginPath(); ctx.arc(mx, my, 13, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#333'; ctx.stroke();
    ctx.fillStyle = '#333'; ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×', mx, my + 1);
  }

  // mouse
  const frames = S.dir > 0 ? SPRITES.runR : SPRITES.runL;
  let src;
  if (S.mode === 'won') src = S.dir > 0 ? SPRITES.idleR : SPRITES.idleL;
  else if (S.mode === 'fall') src = frames[1];
  else src = frames[Math.floor(S.runT / 0.11) % frames.length];
  const img = IMG[src];
  const dw = CFG.drawW, dh = dw * 560 / 720;
  ctx.drawImage(img, S.x - dw * 0.479, S.y - dh * 0.90, dw, dh);
}
function drawCloud(c){
  // one soft rounded cloud: a flat ellipse body with two puffs on top
  ctx.fillStyle = 'rgba(255,255,255,' + c.a + ')';
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, 36 * c.s, 13 * c.s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(c.x - 14 * c.s, c.y - 8 * c.s, 13 * c.s, 0, Math.PI * 2);
  ctx.arc(c.x + 12 * c.s, c.y - 11 * c.s, 16 * c.s, 0, Math.PI * 2);
  ctx.fill();
}
// test hook: generator + world, for the Node harness (harmless in play)
globalThis.__homeTest = {
  get S(){ return S; },
  get platforms(){ return platforms; },
  get rows(){ return rows; },
  get scrolling(){ return scrolling; },
  get groundY(){ return groundY; },
  get bestRow(){ return bestRow; },
  get points(){ return points; },
  get clouds(){ return clouds; },
  get demoState(){ return demoState; },
  get demoWraps(){ return demoWraps; },
  get demoTopWraps(){ return demoTopWraps; },
  get demoClimbs(){ return demoClimbs; },
  get demoPair(){ return demoPair; },
  get log(){ return LOG; },
  get CFG(){ return CFG; },
  getW: () => W, getH: () => H,
  keptLineWillLand, lineWillLand,
};
requestAnimationFrame(tick);
</script>
