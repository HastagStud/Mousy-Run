<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mouse Ramp — Endless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#eaf6ff;
    font-family:-apple-system, system-ui, sans-serif; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #game { position:fixed; inset:0; display:block; }
  /* Points (Jack 2026-11-06): big top-center number, Flappy-style.
     Luckiest Guy, bright gold gradient with a dark brown outline and
     a soft drop shadow; falls back to Arial Black with no network.
     It sits above the canvas (pointer-events none) so it never
     blocks a finger, and on every gain it pops (scale) while six
     gold sparkles burst out of it and fade (~600ms, Jack's pick
     over bounce/flip). The number lives in #pointsNum so the
     sparkles can anchor to it exactly. */
  #points { position:fixed; left:0; right:0; top:calc(8px + env(safe-area-inset-top));
    text-align:center; pointer-events:none; line-height:1; }
  #pointsNum { position:relative; display:inline-block; line-height:1;
    font-family:'Luckiest Guy','Arial Black',sans-serif; font-size:64px;
    background:linear-gradient(180deg,#FFF176 0%,#FFD54F 45%,#FFB300 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:2px #7A4A00; filter:drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
  .spark { position:absolute; left:50%; top:50%; width:10px; height:10px;
    margin:-5px 0 0 -5px; background:#FFD54F; pointer-events:none;
    clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); }
  #reset { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px;
    border:1px solid #c9b896; background:#fff8ea; color:#5a4632;
    border-radius:999px; padding:7px 14px; font-size:13px; }
  /* Cartoonish home icon (Jack 2026-11-11): a little house in the
     top-left corner, mirroring Reset at the top-right. A round cream
     button with the house drawn as an inline SVG (orange roof, cream
     walls, brown door, blue windows, chimney puff). */
  #homeIcon { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:12px;
    width:44px; height:44px; padding:6px; box-sizing:border-box;
    border:1px solid #c9b896; background:#fff8ea; border-radius:999px; }
  #homeIcon svg { display:block; width:32px; height:32px; }
  #banner { position:fixed; left:50%; top:34%; transform:translate(-50%,-50%);
    background:rgba(255,248,234,.96); border:2px solid #e3b93c; border-radius:16px;
    padding:18px 26px; text-align:center; color:#5a4632; display:none;
    box-shadow:0 10px 30px rgba(90,70,20,.25); }
  #banner b { font-size:22px; display:block; margin-bottom:4px; }
  #banner span { font-size:14px; color:#7a6a55; }
  /* Reset button in the death modal (Jack 2026-11-13): the corner Reset
     is a QA tool and hides in the real game, so the modal carries its
     own restart. Same cartoonish Luckiest Guy lettering as the rest of
     the game's display type, orange gradient like PLAY. Always shows
     — it is part of the game, not a QA tool. */
  #bannerReset { display:block; margin:14px auto 0; border:0; cursor:pointer;
    font-family:'Luckiest Guy','Arial Black',sans-serif; font-size:20px; letter-spacing:1px;
    color:#fff; background:linear-gradient(180deg,#ff9a3d 0%,#ff7a1a 50%,#f26c00 100%);
    border-radius:999px; padding:10px 28px;
    box-shadow:0 3px 0 rgba(122,74,0,.45); -webkit-text-stroke:0; }
  #logBtn { position:fixed; top:calc(52px + env(safe-area-inset-top)); right:12px;
    border:1px solid #c9b896; background:rgba(255,248,234,.88); color:#5a4632;
    border-radius:999px; padding:7px 14px; font-size:13px; }
  #logPanel { position:fixed; left:12px; right:12px; top:calc(60px + env(safe-area-inset-top)); bottom:calc(60px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.97); border:2px solid #c9b896; border-radius:16px;
    padding:12px; display:none; z-index:10; }
  #logText { width:100%; height:calc(100% - 44px); box-sizing:border-box;
    font-family:ui-monospace, monospace; font-size:11px; border:1px solid #ddd; border-radius:8px; }
  #logPanel button { border:1px solid #c9b896; background:#fff8ea; color:#5a4632;
    border-radius:999px; padding:7px 14px; font-size:13px; margin-right:8px; }
  #logStatus { font-size:12px; color:#7a6a55; }
  /* Boost (temporary test button, Jack 2026-11-11): sits under LOG.
     Opens a modal with a dropdown of point totals; picking one jumps
     the mouse to that row so the cats for that stage are on screen,
     without having to play there. Each score is a cat milestone. */
  #boostBtn { position:fixed; top:calc(94px + env(safe-area-inset-top)); right:12px;
    border:1px solid #c9b896; background:rgba(255,248,234,.88); color:#5a4632;
    border-radius:999px; padding:7px 14px; font-size:13px; }
  #boostPanel { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%);
    background:rgba(255,248,234,.97); border:2px solid #c9b896; border-radius:16px;
    padding:16px 18px; display:none; z-index:10; width:min(320px, calc(100% - 48px)); box-sizing:border-box;
    color:#5a4632; text-align:center; box-shadow:0 10px 30px rgba(90,70,20,.25); }
  #boostPanel b { font-size:17px; display:block; margin-bottom:6px; }
  #boostPanel p { font-size:13px; color:#7a6a55; margin:0 0 10px; }
  #boostPanel select { width:100%; font-size:15px; padding:8px; border:1px solid #c9b896;
    border-radius:10px; background:#fff; color:#5a4632; margin-bottom:12px; }
  #boostPanel button { border:1px solid #c9b896; background:#fff8ea; color:#5a4632;
    border-radius:999px; padding:7px 16px; font-size:13px; margin:0 4px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="points"><span id="pointsNum">0</span></div>
<button id="reset" type="button">Reset</button>
<button id="homeIcon" type="button" aria-label="Home"><svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><circle cx="47" cy="6" r="3.5" fill="#fff" stroke="#5a4632" stroke-width="1.5"/><rect x="43" y="10" width="8" height="14" rx="2" fill="#c96f2e" stroke="#5a4632" stroke-width="2.5"/><path d="M4 34 L32 12 L60 34 Z" fill="#ff8c42" stroke="#5a4632" stroke-width="3" stroke-linejoin="round"/><rect x="14" y="34" width="36" height="22" rx="3" fill="#ffe9a8" stroke="#5a4632" stroke-width="3"/><path d="M28 56 V46 Q28 40 32 40 Q36 40 36 46 V56 Z" fill="#8b5a2b" stroke="#5a4632" stroke-width="2"/><circle cx="34" cy="49" r="1.3" fill="#ffe9a8"/><circle cx="21" cy="43" r="4.5" fill="#a8d8ea" stroke="#5a4632" stroke-width="2"/><circle cx="43" cy="43" r="4.5" fill="#a8d8ea" stroke="#5a4632" stroke-width="2"/></svg></button>
<div id="banner"><b></b><span></span><button id="bannerReset" type="button">RESET</button></div>

<button id="logBtn" type="button">LOG</button>
<div id="logPanel"><textarea id="logText" readonly></textarea><div><button id="logCopy" type="button">Copy log</button><button id="logClose" type="button">Close</button><span id="logStatus"></span></div></div>
<button id="boostBtn" type="button">BOOST</button>
<div id="boostPanel"><b>Boost points (test only)</b><p>Jump to a point total to see the cats for that stage — no need to play there.</p><select id="boostSelect"><option value="0">0 — No cats (start)</option><option value="5" selected>5 — Orange Tabby appears</option><option value="20">20 — + Black Cat</option><option value="50">50 — + Cream Calico</option><option value="100">100 — + White Cat (all 4)</option><option value="150">150 — up to 2 cats per row</option><option value="200">200 — up to 3 cats per row</option><option value="250">250 — up to 4 cats per row</option></select><div><button id="boostApply" type="button">Boost</button><button id="boostClose" type="button">Close</button></div></div>
<script>
"use strict";
// QA TOOLS (Jack 2026-11-11): Reset, LOG and BOOST are test
// tools, not part of the real game. Keep the components, hide
// the buttons: flip this to false and the three buttons on the
// right disappear (their panels stay in the code, just
// unreachable from the screen). The developer flips it per
// environment — true while Jack is testing, false for the
// real game. The home icon is not a QA tool; it always shows.
const QA_TOOLS = false;
if (!QA_TOOLS){
  for (const id of ['reset', 'logBtn', 'boostBtn']){
    const el = document.getElementById(id);
    if (el && el.style) el.style.display = 'none';
  }
}
// ============================================================
// MOUSE RAMP — ENDLESS (2026-10-26, built on the MVP engine)
// Flappy-simple, one-input game. INFINITE vertical climb: rows are
// generated on the fly under Jack's n/N/x rule, and the frame
// auto-scrolls at a fixed speed once the mouse reaches mid-screen.
//
// The mouse (Jack's footless mouse sprites) ALWAYS runs. He starts
// at the base running left and right, turning at the walls.
//  · Finger down  -> he runs TOWARD the finger.
//  · Fingertip (a small round touch) BLOCKING him -> he bumps it
//    and turns the other way.
//  · Finger laid down at an angle (a long, tilted touch patch) ->
//    it's a RAMP: if he can reach its low edge he runs onto it and
//    follows it up/down, and steps off onto any ledge its far edge
//    touches. That's how you bridge the gaps between platforms.
//  · Finger lifted -> any ramp vanishes; he falls if he was on it,
//    and keeps running in the direction he was running.
//
// Level: endless rows of horizontal ledges, generated as the frame
// scrolls. Row spacing is equal — every row 192px apart (Jack
// 2026-11-04; was random 1–3 inches, 96–288px); every
// row has gaps ≥ 100px and segments ≥ 60px (mouse-width to stand
// on), gaps vary in width, and ~40% of rows have two gaps (Jack
// 2026-11-01). A new row is accepted only if its worst-case travel n_i
// (the farthest the mouse could have to run from any gap he could
// arrive through to the nearest usable gap above) is <= x_max =
// s*h/a — the stress-test rule, so no generated row is ever a
// no-win. Scroll runs at its pace even while he's on a ramp
// (Jack 2026-10-28: the autoscroll should continue and not
// stop). Death: he falls below the screen.
//
// Finger model (honest, same as the pet prototype): a phone gives
// a touch point + approximate patch size/shape (radiusX/radiusY/
// rotationAngle where exposed). An elongated or large patch =
// ramp segment, a small round patch = fingertip blocker. Desktop
// mouse: press-and-drag draws the ramp between press point and
// cursor.
//
// FIX 2026-10-23 (Jack: "diagonal finger doesn't become a ramp"):
// three stacked causes — (1) iOS can fire touchstart BEFORE
// pointerdown, and the old patch handler dropped the patch if the
// press hadn't registered yet, so a still-held finger stayed a
// round fingertip forever; the patch is now cached on touchstart
// and merged into the press whenever it lands. (2) The old ramp
// cutoff (patch radius >= 48) sat above what a real diagonal
// finger pad often reports; classification now uses elongation
// (ratio) as well as size, and the segment is extended to a
// usable finger length — the sensor only reports the contact
// core, not the whole finger. (3) The step-up tolerance (26px)
// was thinner than a finger; it's now ~a finger's thickness.
//
// FIX 2 2026-10-23 (still failing on Jack's phone): stop relying
// on the patch ellipse alone — its orientation data is unreliable
// across devices. A touch that MOVES now defines the ramp from
// its own path: when you lay a finger down, the touch point
// travels from your fingertip toward your hand as the finger
// flattens, and a deliberate short slide does the same. That
// trajectory (start point -> current point, extended to ramp
// length) becomes the ramp whenever it makes a runnable slope;
// the patch ellipse is the fallback for a perfectly still lay.
// Gesture: touch at one end of the ramp you want, slide a short
// way along it, hold.
//
// FIX 3 2026-10-23 — MEASURED on Jack's iPhone via Touch Lab:
// rotationAngle is ALWAYS 0.0° and radiusY can read 0.0; the
// PointerEvent contact size is a square (97x97). So the patch
// ellipse carries NO orientation on his device — the old code
// turned every diagonal finger into a HORIZONTAL bar. Confirmed
// too: touchstart fires before pointerdown there. And his
// natural diagonal lay travels at ~58° of slope (250px from
// (307,521) to (176,309)) — steeper than the old 55° climb
// limit, so even the correct segment was rejected as a wall.
// Changes: the touch path now ALWAYS wins over the patch when
// the touch has travelled, and the climbable limit is 70°
// (a mouse can scramble up a steep ramp; only near-vertical
// is a wall).
// ============================================================

const CFG = {
  speed: 0,            // derived below from the speed formula s/a = L/h (Jack 2026-11-05)
  gravity: 1900,       // px/s^2 while falling
  climb: 54,           // px he can step up/down onto a ramp edge (~finger thickness)
  transfer: 40,        // px ledge-height tolerance stepping off a ramp
  faceH: 14,           // drawn platform height — a line ending on the platform's visible face counts as connecting
  edgeSnap: 48,        // px: a ramp's far end may miss a platform's edge by this much and still count as landing on it
  snapR: 64,          // B: auto-snap radius — a drawn endpoint within this of his platform / an edge above snaps to it
  maxRampDeg: 88,      // Jack 2026-11-05: so long as the line isn't vertical, it should be good — only a line within 1.5deg of vertical is rejected (was 70)
  lookahead: 400,      // px of generated rows kept above the screen top
  halfW: 27,           // mouse body half-width for support/collision
  bodyH: 66,           // mouse body height
  drawW: 104,          // sprite draw width (canvas art is 720x560)
};

const IMG = {};
Object.values(SPRITES).flat().forEach(src => { const i = new Image(); i.src = src; IMG[src] = i; });

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const banner = document.getElementById('banner');

let W = innerWidth, H = innerHeight;
function fitCanvas(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ---------- world (endless) ----------
let groundY = 0, platforms = [], rows = [];
let scrolling = false, bestRow = 0, points = 0; // points: Flappy-style score (Jack 2026-11-06) — highest row reached, each row counting once
let clouds = []; // soft rounded clouds (Jack 2026-11-06) — screen-space decoration, behind everything
const SCROLL_A = 60; // px/s, fixed frame scroll — slowed 50% from 120 (Jack 2026-11-05)
// Equal row spacing (Jack 2026-11-04): every row is 192px
// apart (was random 96–288px).
const ROW_H = 192;
// Speed formula, capped platform (Jack 2026-11-05): the mouse
// speed no longer depends on W. His premise L = (W-g)+d made s
// grow with the screen (445 on his iPad vs 158 on his iPhone),
// so the run is now capped at the longest platform the
// generator actually builds: M = 220 (single-gap segMax). L =
// M+d — run one capped segment then climb the diagonal d =
// sqrt(h^2+g^2) — in the same time the scroll advances one row
// (h/a). So s/a = L/h, i.e. s = a*L/h. g is still the minimum
// gap (100px). s = 136 at a=60, on every screen width; h stays
// 192, a stays 60. The per-row cap (s*h/a) is now also
// W-independent (~435), so the generator's gap-chain
// acceptance actually bites on wide screens too (on the iPad
// build it never bound, because the budget exceeded the
// screen). Wider screens just tile more segments/gaps per row;
// the mouse never has to cross the whole width.
const GAP_G = 100; // minimum gap, px — the constant g in the speed formula
const PLATFORM_CAP = 220; // M: longest segment the generator builds (single-gap segMax) — the capped platform run
const PATH_D = Math.sqrt(ROW_H * ROW_H + GAP_G * GAP_G); // diagonal, 216.5 at h=192, g=100
const PATH_L = PLATFORM_CAP + PATH_D; // full path, 436.5 at M=220 — no W in it
const SPEED_RATIO = PATH_L / ROW_H; // ~2.27
CFG.speed = Math.round(SCROLL_A * SPEED_RATIO); // 136 at a=60, on any screen width
// Speed ramp (Jack 2026-11-09): the game speeds up as he
// climbs — the scroll gains RAMP_PER_ROW for every row
// reached, up to RAMP_MAX_A. The mouse speed follows the
// formula (s = a*L/h), so the climb timing stays right and
// the generator budget (s*h/a = L) never changes — the
// platforms don't need to change, only the pace.
const RAMP_PER_ROW = 2; // px/s of scroll per row climbed
const RAMP_MAX_A = 90; // scroll caps here (mouse caps at ~205)
let curA = SCROLL_A; // current scroll speed — starts at 60, ramps with bestRow
function applySpeedRamp(){
  const a = Math.min(RAMP_MAX_A, SCROLL_A + RAMP_PER_ROW * bestRow);
  if (a !== curA){
    curA = a;
    CFG.speed = Math.round(curA * SPEED_RATIO);
    logEvent('SPEED', 'a=' + curA + ' s=' + CFG.speed + ' rows=' + bestRow);
  }
}
const FOOTPRINT = 1 / Math.tan(CFG.maxRampDeg * Math.PI / 180); // ~0.035: horizontal run a max-slope climb needs (was ~0.364 at 70deg)
const rnd = (a, b) => a + Math.random() * (b - a);
// Mouse traps (Jack 2026-11-09, death on touch): a trap is a
// hazard on a platform — touching it ends the run. At most one
// per row, only on some rows (TRAP_P), never in the first few
// rows (TRAP_MIN_ROW), and only on a segment long enough to

// Ball cats (Jack 2026-11-10, villains/obstacles for Mousy Run):
// a cat is a ball about the mouse's size, walking a platform.
// Each colour joins the pool at its own row (CAT_COLOR_ROW):
// Orange Tabby from 5, Black from 20, Cream Calico from 50,

// ones, it just joins them. Cats walk back and forth along
// their segment at their colour's pace (CAT_SPEED, a multiple
// of the mouse's current speed): Orange Tabby is the slowest

// White is 50% faster. A row holds at most one cat until 150,

// a failsafe so the late game doesn't get boring, even though
// most players will never get that high — but only one cat per

// inconsistent on purpose (Jack 2026-11-01): single-gap rows

// are multi-gap rows — smaller pieces so two gaps fit (phone
// widths fit at most two: 2 gaps + 3 segments need 380px at the

// The worst-travel acceptance in genRow still gates every row,
// so varied and multi-gap rows stay winnable.
function genRowGaps(){

  // single-gap draw succeeds almost immediately, so rolling
  // inside the retry loop lets single draws crowd out every
  // multi draw before it gets its attempts (a first pass with
  // the roll inside produced 9 multi rows in 2000 calls).
  const multi = Math.random() < 0.4;
  for (let attempt = 0; attempt < 200; attempt++){
    // Multi-gap pieces stay near the floors on purpose: two gaps
    // (100px each) plus three segments (60px each) already need
    // 380px, leaving only 10px of slack on a 390px screen (50px
    // on a 430px phone) — wider multi pieces almost never fit,
    // which is why a first pass with roomy ranges produced zero
    // multi-gap rows in 2000 generated rows.
    // Multi-gap pieces grow with screen width (Jack 2026-11-06):
    // on a phone they must stay near the floor — two gaps (100px
    // each) plus three pieces (60px each) need 380px minimum — but
    // on a wide screen the same small pieces chop every row into
    // stubs. The slack over a 390px phone is shared across the
    // three pieces, capped at PLATFORM_CAP so no drawn piece ever
    // exceeds the formula's M (and the mouse speed never changes).
    // At 390px this is exactly 80, as before; at 810px and up it
    // reaches the 220 cap. (The trailing platform can still run
    // longer: when a gap doesn't fit at the row's end, the last
    // two drawn pieces merge into one platform — pre-existing.)

        if (S.surface.type === 'ground') tx = clamp(tx, 28, W - 28);

    if (S.mode === 'run'){

      // not jump him off it (Jack 2026-10-28): the climb keeps
      // the kept line he mounted, while the new line is drawn
      // (and kept on release) alongside it. A badge tap is not a
      // draw (deletePress keeps the delete-fall), and a live-line
      // climb is untouched — that line is gone with the old finger.
      // The climb reads S.climbSeg (the line he mounted), not the
      // kept slot: a new draw while climbing a locked line replaces
      // the kept slot on release (Jack 2026-11-09: you can draw a
      // new line while climbing a locked line), and he keeps
      // climbing the old line — reading the slot would switch him
      // to the new line. Live lines keep the old path (a new press
      // replacing a live line still drops him, below).
      if (S.surface.type === 'finger' && !S.deletePress){

        else if (S.rampSlot === 1 && S.keptSeg) seg = S.keptSeg;
        else if (S.rampSlot === 2 && S.keptSeg2) seg = S.keptSeg2;
        else if (S.rampSlot === 2 && S.keptSeg) seg = S.keptSeg; // the other line was deleted and this one promoted
      }

      // steepen past the limit purely because scroll/follow rides its start
      // down while the end stays put — that is the world's movement,
      // not his, so it must not drop him. Finger-dragged steepening
      // (the mount-time line is itself unclimbable) still drops him,
      // as the flicker rule requires.

      const nodeWorldSteepened = nodeLock && nodeLock.finger === S.finger && nodeLock.mountSy !== undefined && seg && segClimbable({ ax: seg.ax, ay: nodeLock.mountSy, bx: seg.bx, by: seg.by });
      // if his surface was the finger and it's gone (or turned too steep), he falls

      else {

        // or kept — must not be mounted before it. With the finger

        // kept line); the live line being drawn was the hole.
        // Only while running: when he is already climbing, seg is
        // the line he mounted (S.climbSeg, above) and must not be
        // overwritten by the kept slot — a new draw may have
        // replaced it while he climbs the old line.
        if (S.keptSeg && S.surface.type !== 'finger') seg = S.keptSeg;
        // mount a climbable ramp he has just reached — judged at the
        // ramp point nearest his body, so his front reaching the
        // ramp's low edge counts, not just his centre arriving

          // front must not change his trajectory or location — he
          // keeps running straight and mounts only at the line's
          // foot, from the side where it makes the largest angle
          // with the surface (the foot between him and the far
          // end). Approaching from the high/acute side, or mid-line,
          // he runs past instead of snapping onto it. But a foot
          // just BEHIND him still counts as AT it — the exit steps
          // him 4px past the far end, so a green line starting at
          // the node he just landed on would otherwise be ignored
          // (Jack 2026-11-09 log: he exited onto [242,430] at
          // x=246, the foot at x=244, and ran off the edge). The
          // tolerance is 8px behind him only, so a line he is
          // still approaching from the acute side still does not
          // mount.

          const dFoot = S.x - foot.x;

            // its far (climb-target) end

            S.rampOrigin = S.surface; S.surface = { type: 'finger' }; S.rampDir = S.dir; S.x = nx; S.y = yAt; S.rampFinger = S.finger; S.rampSlot = (seg === S.keptSeg) ? 1 : ((seg === S.keptSeg2) ? 2 : 'live'); S.climbSeg = seg; // the line he is climbing — the kept slot may be replaced by a new draw while he is on it, so the climb reads this, not the slot
            if (startLock && startLock.finger === S.finger) startLock.mountSy = startLock.sy; // snapshot the locked start's height at mount, for the world-steepening test below

        }

        if (S.surface.type === 'finger' && seg){

          { const g = lineWillLand(seg); if (g !== lastGreen){ lastGreen = g; logEvent('GREEN', 'now=' + g + ' seg=' + segStr(seg) + ' at=(' + Math.round(S.x) + ',' + Math.round(S.y) + ')'); } }
          // crossing rule: if this line runs through a platform
          // ahead of him, he does NOT pass through it — at the
          // crossing he drops vertically to the next platform below.
          const block = rampBlocker(seg, S.x, S.rampDir);
          if (block && ((S.dir > 0 && nx >= block.x) || (S.dir < 0 && nx <= block.x))){

            S.verticalFall = true; S.fallExclude = block.plat; if (S.rampSlot === 'live') S.spentFinger = S.rampFinger; clearKept(seg);
            S.surface = { type: 'air' };
            logEvent('FALL', 'reason=crossing at=(' + block.x + ',' + block.y + ') crossed=' + platStr(block.plat) + ' seg=' + segStr(seg));
          } else {
          S.x = nx; S.y = segYAt(seg, S.x);

          // being just short of the entry edge is him stepping on
          if ((S.dir > 0 && S.x > hi + 6) || (S.dir < 0 && S.x < lo - 6)){

            // onto a touching ledge (exact, snap, or step-up), drop
            // vertically onto a platform below, or fall
            const landing = exitLanding(endX, endY);

            const drop = landing && landing.drop ? landing.drop : null;

            logEvent('EXIT', 'end=(' + Math.round(endX) + ',' + Math.round(endY) + ') landing=' + (plat ? 'plat ' + platStr(plat) : (drop ? 'drop ' + platStr(drop) : 'fall')) + ' seg=' + segStr(seg));

          }
        } else if (S.surface.type !== 'finger'){

          if (S.surface.type === 'ground'){

            if (S.x > W - 28){ S.x = W - 28; S.dir = -1; }
            S.y = groundY;
          } else { // platform
            S.y = S.surface.y;
            // He can run off the platform's edge again (Jack

            // edge he falls. The mount check above runs first, so
            // a ramp whose foot is at the edge still mounts
            // before he can run off.
            if (S.x < S.surface.x1 || S.x > S.surface.x2){

          }
        }

    }

    if (S.mode === 'fall'){
      const prevBottom = S.y;
      S.vy += CFG.gravity * dt;
      // a vertical fall (ramp crossing) drops straight down: no
      // mid-air running, no wall turns — x is locked until landing
      if (!S.verticalFall){
        S.x += S.dir * CFG.speed * dt;   // keeps running in his direction mid-air
        if (S.x < 28){ S.x = 28; S.dir = 1; }
        if (S.x > W - 28){ S.x = W - 28; S.dir = -1; }
      }

    }

    // earns the rows gained (1 above = 1, 2 above = 2 — the rows
    // bypassed count too), and each row counts only once, so points
    // is the highest row reached. bestRow stays as the diagnostic
    // twin (SCROLL/DEATH logs, harness).
    if (S.mode === 'run' && S.surface.row && S.surface.row > bestRow){
      bestRow = S.surface.row;
      const delta = S.surface.row - points;
      points = S.surface.row;
      setScore(delta);
      applySpeedRamp(); // speed ramp: a new best row steps the pace up (logged as SPEED)
    }
    // Mouse trap (Jack 2026-11-09, death on touch): running
    // into, landing on, or exiting onto a trap ends the run.
    // Checked once per tick, after all movement and landings
    // (and after points, so he keeps the row he died on), so a
    // trap landing can't be stepped off before it fires. He is
    // never on a trap while climbing a ramp — only while running
    // on the platform it sits on — so ramping over one is safe.
    if (S.mode === 'run' && S.surface && S.surface.type !== 'finger' && trapAt(S.surface, S.x)) dieTrap();
    // Ball cat (Jack 2026-11-10, death on touch): running into,
    // landing on, or exiting onto a cat ends the run, same as a
    // trap. Ramping over one is safe.
    if (S.mode === 'run' && S.surface && S.surface.type !== 'finger' && catAt(S.surface, S.x)) dieCat();
    // scroll starts when he gets onto row 1 (Jack 2026-11-09) —
    // not when he reaches mid-screen. The world starts moving as
    // soon as he starts climbing, so the ground leaves sooner: a
    // fall from row 1 is fatal once the ground has scrolled off
    // the bottom (about 0.7s after row 1 on a phone screen).
    if (!scrolling && bestRow >= 1){ scrolling = true; logEvent('SCROLL', 'start at y=' + Math.round(S.y) + ' rows=' + bestRow); }
    // No follow (Jack 2026-11-09: cap the world at the scroll
    // speed). The follow used to translate the whole view down
    // whenever he rose above the middle, so the world moved at
    // scroll + his climb rate (up to ~200px/s) during climbs —
    // Jack reported it as the scroll quickening. The scroll
    // already uses the full budget, so a capped follow adds
    // nothing: the world now moves at exactly the current ramp
    // speed (curA), always. He rises up the screen as he climbs
    // instead of staying pinned at the middle, and can drift off
    // the top on chained short rows — there is no top death, and
    // the scroll brings him back into view (or he runs off an
    // edge and falls).
    // death: he fell below the bottom of the screen
    if (S.mode !== 'lost' && S.y > H + 40){
      S.mode = 'lost';
      banner.querySelector('b').textContent = 'He slipped away! \u{1F42D}';
      banner.querySelector('span').textContent = points + ' points — tap Reset to try again';
      banner.style.display = 'block';
      logEvent('DEATH', 'y=' + Math.round(S.y) + ' rows=' + bestRow);

      // from localStorage — save only when this run beats it.
      try {
        const prev = parseInt(localStorage.getItem('mousyRunBest') || '0', 10) || 0;
        if (points > prev) localStorage.setItem('mousyRunBest', String(points));
      } catch (e){}
    }
  }

  // The line he is climbing only lives while he is on a finger
  // surface — once he exits, falls, or lands elsewhere it is
  // gone (the kept slot, if a new draw replaced it, stays).
  if (S.surface.type !== 'finger') S.climbSeg = null;
  draw(now);
  requestAnimationFrame(tick);
}

// ---------- draw ----------
function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();

function draw(now){

  // strip is clipped to the bar so its square corners can't poke
  // past the rounded ends. Purely visual: p.x1/p.x2 are unchanged.
  for (const p of platforms){

    ctx.strokeStyle = 'rgba(255,224,130,0.55)'; ctx.lineWidth = 2; ctx.stroke();

    // a wooden base with a metal snap bar and a spring hinge.
    // Death on touch.
    if (p.trapX !== undefined && p.trapX !== null){
      const tx = p.trapX;

    // the platform top, about the mouse's size. Death on touch.

    // 2026-11-11): the mouse's ball body, no tail, a white eye
    // with a black pupil, with each cat's own fur and ears. The
    // run cycle is the mouse's own — the same 4-step ping-pong
    // (1,2,3,2) at the mouse's 0.11s per frame, off the cat's
    // walk clock — and the cat faces the way it runs, mirrored
    // when moving left (the mouse's left/right sprite sets).
    // No lean: the mouse runs upright, and so do the cats.
    if (p.cats){

  // the rings sit outside the outline (NODE_DRAW + 9). A green

  let farPreview = null;

  if (snapFlash){

  // stay visible until he exits it.

    const isKept = seg === S.keptSeg || seg === S.keptSeg2;

    const lands = (isKept && !climbing) ? keptLineWillLand(seg) : lineWillLand(seg);

    // 2026-10-29). Cosmetic only: a round cap extends the
    // VISIBLE line 8px past each logical end (half the 16px
    // width), so a line can look like it touches a platform when
    // its logical end stops just short — the logical segment,
    // the green rule, and mount/exit are all unchanged, and the
    // color (not the cap) is what promises a connection.
    ctx.strokeStyle = lands ? (kept ? 'rgba(30,125,50,.6)' : 'rgba(30,125,50,.9)') : (kept ? 'rgba(255,205,140,.6)' : 'rgba(255,205,140,.9)'); ctx.lineWidth = 16; ctx.lineCap = 'round';

    ctx.fillStyle = '#333'; ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×', mx, my + 1);
  }
  if (S.keptSeg2){
    const mx = (S.keptSeg2.ax + S.keptSeg2.bx) / 2, my = (S.keptSeg2.ay + S.keptSeg2.by) / 2;
    ctx.beginPath(); ctx.arc(mx, my, 13, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#333'; ctx.stroke();
    ctx.fillStyle = '#333'; ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×', mx, my + 1);
  }

  // mouse
  const frames = S.dir > 0 ? SPRITES.runR : SPRITES.runL;
  let src;
  if (S.mode === 'won') src = S.dir > 0 ? SPRITES.idleR : SPRITES.idleL;
  else if (S.mode === 'fall') src = frames[1];
  else src = frames[Math.floor(S.runT / 0.11) % frames.length];
  const img = IMG[src];
  const dw = CFG.drawW, dh = dw * 560 / 720;
  ctx.drawImage(img, S.x - dw * 0.479, S.y - dh * 0.90, dw, dh);
}
function drawCloud(c){

  TRAP_HALF, TRAP_P, TRAP_MIN_ROW, TRAP_MIN_SEG, TRAP_EDGE,

  get curA(){ return curA; },
